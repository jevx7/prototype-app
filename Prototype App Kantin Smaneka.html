<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KantinKita SMANEKA — Prototipe Interaktif</title>
<style>
:root{--g:#087957;--g2:#13a879;--mint:#e8f6e9;--ink:#14243a;--muted:#667987;--line:#e2eae5;--cream:#fbfcf7;--orange:#f5b65c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px 17px}.brand{display:flex;align-items:center;gap:10px}.logo{width:47px;height:47px;display:grid;place-items:center;background:linear-gradient(135deg,#0c9b70,#07543e);color:white;border-radius:15px;font-size:26px}.brand h1{margin:0;color:var(--g);font-size:21px}.brand small{font-weight:800;letter-spacing:2px;color:#477468}.role{display:flex;gap:7px;flex-wrap:wrap}.btn,.role button{border:1px solid #cfe2d7;background:white;color:var(--g);padding:10px 14px;border-radius:11px;font-weight:750}.primary,.role button.active{background:linear-gradient(100deg,#07845e,#13a879);color:#fff;border-color:transparent}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);gap:17px;margin-top:17px}.side,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 24px #163e2208}.side{padding:14px;height:max-content}.profile{padding:13px;background:var(--mint);border-radius:14px;margin-bottom:12px}.profile b{display:block}.profile small{color:var(--muted)}.nav{display:grid;gap:5px}.nav button{text-align:left;border:0;background:transparent;color:#425764;border-radius:11px;padding:11px;font-weight:700}.nav button.active,.nav button:hover{background:#e6f6eb;color:var(--g)}.panel{padding:21px;min-height:620px}.welcome{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:22px;border-radius:17px;background:linear-gradient(120deg,#e3f5e3,#f2faf0);margin-bottom:17px}.welcome h2{margin:0 0 7px;font-size:clamp(22px,3vw,29px)}.welcome p{margin:0;color:#597266;line-height:1.5}.tag{background:#d4efdf;color:var(--g);padding:7px 10px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}.stat{border:1px solid var(--line);border-radius:14px;padding:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;color:var(--g);font-size:24px;margin-top:5px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 12px}.head h2,.head h3{margin:0}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:0 0 12px;outline-color:var(--g)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.filter{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;color:#52636c;font-size:12px}.filter.active{background:var(--g);color:#fff;border-color:var(--g)}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}.food{height:105px;display:grid;place-items:center;font-size:49px;background:linear-gradient(135deg,#fff0d2,#e5f4df)}.productbody{padding:11px}.product h4{margin:0 0 5px;font-size:14px}.price{font-weight:850;color:var(--g)}.stock{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:8px;background:#e5f7eb;color:#12805a;font-size:10px;font-weight:800}.stock.out{background:#ffe8e4;color:#ba4035}.footrow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px}.add{border:0;border-radius:9px;background:var(--g);color:white;font-weight:900;width:30px;height:30px}.add:disabled{opacity:.35}.box{padding:15px;border:1px solid #dceee1;background:#f5faf5;border-radius:14px;margin-top:15px}.cartrow,.orderrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;gap:8px;align-items:center}.qty button{border:0;border-radius:7px;background:#e5f4e9;color:var(--g);width:25px;height:25px;font-weight:900}.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.label{display:block;font-size:12px;font-weight:800;margin:13px 0 6px}.primary{border:0;border-radius:11px;padding:12px 15px;font-weight:800}.wide{width:100%;margin-top:13px}.outline{border:1px solid #acd9c4;background:#fff;color:var(--g);border-radius:11px;padding:11px 14px;font-weight:750}.hidden{display:none!important}.success{text-align:center;padding:30px 10px}.check{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#dcf5e4;color:var(--g);font-size:39px}.number{font-size:30px;color:var(--g);font-weight:950}.timeline{max-width:510px;margin:18px auto;text-align:left}.step{display:flex;gap:12px;align-items:center;padding:13px;border-bottom:1px solid var(--line)}.dot{width:35px;height:35px;border-radius:50%;background:#e2f4e7;color:var(--g);display:grid;place-items:center;flex-shrink:0}.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:#e2f5e8;color:var(--g);padding:5px 8px;border-radius:99px;font-size:10px;font-weight:850}.empty{text-align:center;padding:38px 10px;color:var(--muted)}.empty div{font-size:42px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.footer{text-align:center;padding:18px 0;color:#82918a;font-size:11px}.qr{max-width:360px;margin:15px auto;text-align:center;padding:25px;border:2px solid var(--g);border-radius:20px;background:linear-gradient(140deg,#e8f7e7,#fff)}.qrmark{font-size:85px;line-height:1.3}.sellergrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}
@media(max-width:760px){.app{padding:9px}.top{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.side{padding:9px}.profile{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.panel{padding:14px;min-height:520px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome{align-items:flex-start;flex-direction:column}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:20px}.sellergrid{grid-template-columns:1fr}}@media(max-width:390px){.products{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="logo">🍱</div><div><h1>KantinKita</h1><small>SMANEKA</small></div></div><div class="role"><button id="studentRole" class="active" onclick="setRole('student')">👩‍🎓 Siswa</button><button id="sellerRole" onclick="setRole('seller')">🧑‍🍳 Penjual</button></div></header>
<div class="layout"><aside class="side"><div class="profile"><b id="profileName">Halo, Andi! 👋</b><small id="profileDesc">Pesan makanan tanpa antre.</small></div><nav class="nav" id="nav"></nav></aside><main><section class="panel" id="view"></section></main></div><div class="footer">KantinKita SMANEKA • Prototipe interaktif untuk SMA Negeri 1 Kepanjen, Kabupaten Malang<br>Harga dan menu merupakan data contoh demonstrasi.</div></div>
<script>
const menu=[{id:1,name:'Mie Ayam',price:12000,cat:'Makanan',icon:'🍜',stock:true},{id:2,name:'Bakso Ayam',price:12000,cat:'Makanan',icon:'🍲',stock:true},{id:3,name:'Ayam Geprek',price:15000,cat:'Makanan',icon:'🍛',stock:true},{id:4,name:'Seblak',price:12000,cat:'Makanan',icon:'🥘',stock:false},{id:5,name:'Es Teh Manis',price:5000,cat:'Minuman',icon:'🥤',stock:true},{id:6,name:'Jajanan',price:4000,cat:'Jajanan',icon:'🧁',stock:true},{id:7,name:'Buah Potong',price:6000,cat:'Buah',icon:'🍉',stock:true},{id:8,name:'Jus Buah',price:8000,cat:'Minuman',icon:'🧃',stock:true}];let role='student',page='home',cart={},orders=[],filter='Semua',search='',counter=1,lastOrder=null;
const rp=n=>'Rp '+n.toLocaleString('id-ID');const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+menu.find(m=>m.id==id).price*q,0);
function setRole(r){role=r;page=r==='student'?'home':'dashboard';document.getElementById('studentRole').classList.toggle('active',r==='student');document.getElementById('sellerRole').classList.toggle('active',r==='seller');document.getElementById('profileName').textContent=r==='student'?'Halo, Andi! 👋':'Dashboard Penjual';document.getElementById('profileDesc').textContent=r==='student'?'Pesan makanan tanpa antre.':'Kelola pesanan dan stok kantin.';render()}
function go(p){page=p;render()}function itemsNav(){return role==='student'?[['home','⌂','Beranda'],['menu','▦','Daftar Menu'],['cart','🛒','Keranjang'],['orders','▤','Status Pesanan']]:[['dashboard','⌂','Dashboard'],['incoming','▤','Pesanan Masuk'],['stock','▦','Kelola Stok'],['qr','▣','QR Code Akses']]}
function render(){document.getElementById('nav').innerHTML=itemsNav().map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${ic} &nbsp; ${t}</button>`).join('');let v=document.getElementById('view');let pages={home,menu:menuPage,cart:cartPage,checkout:checkoutPage,success:successPage,orders:ordersPage,dashboard,incoming,stock,qr:qrPage};v.innerHTML=(pages[page]||home)()}
function card(m){return `<article class="product"><div class="food">${m.icon}</div><div class="productbody"><h4>${m.name}</h4><div class="price">${rp(m.price)}</div><span class="stock ${m.stock?'':'out'}">${m.stock?'Tersedia':'Habis'}</span><div class="footrow"><small class="hint">${m.cat}</small><button class="add" ${m.stock?'':'disabled'} onclick="add(${m.id})">+</button></div></div></article>`}
function home(){return `<div class="welcome"><div><h2>Selamat datang, Andi! 👋</h2><p>Istirahat untuk makan, bukan mengantre. Pesan lebih awal agar makanan siap saat istirahat.</p></div><span class="tag">✨ Mudah • Cepat • Tanpa Antre</span></div><div class="stats"><div class="stat"><span>Menu tersedia</span><strong>${menu.filter(m=>m.stock).length}</strong></div><div class="stat"><span>Keranjang</span><strong>${count()} item</strong></div><div class="stat"><span>Pesanan aktif</span><strong>${orders.filter(o=>o.status!=='Siap Diambil').length}</strong></div></div><div class="head"><h3>Kategori Menu</h3><button class="outline" onclick="go('menu')">Lihat semua →</button></div><div class="filters">${['Makanan','Jajanan','Minuman','Buah'].map(c=>`<button class="filter" onclick="filter='${c}';go('menu')">${c}</button>`).join('')}</div><div class="head"><h3>Menu Populer</h3></div><div class="products">${menu.filter(m=>m.stock).slice(0,3).map(card).join('')}</div><div class="box"><b>🕒 Pesan sekarang</b><p class="hint">Pilih menu, tentukan waktu pengambilan, lalu pantau status pesanan.</p><button class="primary" onclick="go('menu')">Pesan sekarang</button></div>`}
function menuPage(){let list=menu.filter(m=>(filter==='Semua'||m.cat===filter)&&(m.name.toLowerCase().includes(search.toLowerCase())));return `<div class="head"><h2>Daftar Menu & Harga</h2><span class="tag">Informasi stok</span></div><input class="search" placeholder="⌕ Cari menu..." value="${search}" oninput="search=this.value;let p=this.selectionStart;render();let e=document.querySelector('.search');e.focus();e.setSelectionRange(p,p)"><div class="filters">${['Semua','Makanan','Minuman','Jajanan','Buah'].map(c=>`<button class="filter ${filter===c?'active':''}" onclick="filter='${c}';render()">${c}</button>`).join('')}</div><div class="products">${list.map(card).join('')||'<div class="empty">Menu tidak ditemukan.</div>'}</div><div class="box"><b>Keranjang: ${count()} item</b><p class="hint">Total sementara: ${rp(total())}</p><button class="primary" onclick="go('cart')">Lihat keranjang</button></div>`}
function add(id){let m=menu.find(m=>m.id===id);if(m.stock)cart[id]=(cart[id]||0)+1;render()}function qty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()}
function cartPage(){let es=Object.entries(cart);return `<div class="head"><h2>Keranjang Pesanan</h2><span class="tag">${count()} item</span></div>${es.length?es.map(([id,q])=>{let m=menu.find(m=>m.id==id);return `<div class="cartrow"><div><b>${m.icon} ${m.name}</b><div class="hint">${rp(m.price)} per item</div><div class="qty"><button onclick="qty(${id},-1)">−</button>${q}<button onclick="qty(${id},1)">+</button></div></div><b>${rp(m.price*q)}</b></div>`}).join(''):`<div class="empty"><div>🛒</div><h3>Keranjang masih kosong</h3><p>Pilih makanan favoritmu dari daftar menu.</p><button class="primary" onclick="go('menu')">Pilih menu</button></div>`}${es.length?`<div class="box"><div class="cartrow"><b>Total pembayaran</b><strong class="price">${rp(total())}</strong></div><button class="primary wide" onclick="go('checkout')">Lanjutkan pemesanan →</button></div>`:''}`}
function checkoutPage(){return `<div class="head"><h2>Buat Pesanan</h2><span class="tag">Detail pesanan</span></div><div class="box"><b>Ringkasan</b>${Object.entries(cart).map(([id,q])=>`<div class="cartrow"><span>${menu.find(m=>m.id==id).name} × ${q}</span><b>${rp(menu.find(m=>m.id==id).price*q)}</b></div>`).join('')}<div class="cartrow"><b>Total</b><b class="price">${rp(total())}</b></div></div><label class="label">Pilih waktu pemesanan</label><select id="time" class="field"><option>Sebelum istirahat</option><option>Saat istirahat</option></select><label class="label">Metode pembayaran</label><select id="pay" class="field"><option>Tunai di Stand</option><option>QRIS / E-wallet (simulasi)</option></select><label class="label">Nama pemesan</label><input id="buyer" class="field" placeholder="Contoh: Andi Pratama"><label class="label">Kelas</label><input id="kelas" class="field" placeholder="Contoh: XI-2"><div class="head"><button class="outline" onclick="go('cart')">← Kembali</button><button class="primary" onclick="submitOrder()">Kirim Pesanan</button></div><p class="hint">Pembayaran digital hanya simulasi. Prototipe tidak memproses transaksi sungguhan.</p>`}
function submitOrder(){let name=document.getElementById('buyer').value.trim(),kelas=document.getElementById('kelas').value.trim();if(!name||!kelas){alert('Isi nama pemesan dan kelas terlebih dahulu.');return}lastOrder={id:'KK-'+String(counter++).padStart(3,'0'),name,kelas,items:{...cart},total:total(),time:document.getElementById('time').value,pay:document.getElementById('pay').value,status:'Pesanan Diterima',clock:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};orders.unshift(lastOrder);cart={};page='success';render()}
function successPage(){let o=lastOrder;return `<div class="success"><div class="check">✓</div><h2>Pesanan Berhasil!</h2><p class="hint">Pesananmu telah diteruskan ke penjual kantin.</p><div class="box" style="max-width:460px;margin:20px auto;text-align:left"><div class="hint">Nomor Pesanan</div><div class="number">${o?.id||'KK-001'}</div><hr style="border:0;border-top:1px solid var(--line)"><b>${o?.name||'Andi'} • ${o?.kelas||'XI'}</b><p>${o?Object.entries(o.items).map(([id,q])=>menu.find(m=>m.id==id).name+' × '+q).join('<br>'):''}</p><div class="cartrow"><span>Total pesanan</span><b>${rp(o?.total||0)}</b></div><p class="hint">${o?.time||''}<br>${o?.pay||''}</p></div><button class="primary" onclick="go('orders')">Lihat Status Pesanan</button> <button class="outline" onclick="go('home')">Kembali ke Beranda</button></div>`}
function ordersPage(){return `<div class="head"><h2>Status Pesanan</h2><span class="tag">Real-time demo</span></div>${orders.length?orders.map(o=>`<div class="card"><div class="cardtop"><b>${o.id}</b><span class="badge">${o.status}</span></div><p class="hint">${o.name} • ${o.clock}</p><div class="timeline"><div class="step"><div class="dot">✓</div><div><b>Pesanan Diterima</b><div class="hint">${o.clock}</div></div></div><div class="step"><div class="dot">⚙</div><div><b>Sedang Diproses</b><div class="hint">Kantin sedang menyiapkan pesanan</div></div></div><div class="step"><div class="dot">✓</div><div><b>Siap Diambil</b><div class="hint">Tunjukkan nomor pesanan di stan kantin</div></div></div></div><b class="price">${rp(o.total)}</b></div>`).join(''):`<div class="empty"><div>🧾</div><h3>Belum ada pesanan</h3><p>Pesananmu akan muncul di halaman ini.</p><button class="primary" onclick="go('menu')">Mulai memesan</button></div>`}`}
function dashboard(){return `<div class="welcome"><div><h2>Dashboard Penjual</h2><p>Kelola pesanan dan stok menu kantin.</p></div><span class="tag">SMANEKA</span></div><div class="stats"><div class="stat"><span>Total pesanan hari ini</span><strong>${orders.length}</strong></div><div class="stat"><span>Pesanan diproses</span><strong>${orders.filter(o=>o.status!=='Siap Diambil').length}</strong></div><div class="stat"><span>Menu tersedia</span><strong>${menu.filter(m=>m.stock).length}</strong></div></div><div class="head"><h3>Menu utama penjual</h3></div><div class="card"><div class="cardtop"><div><b>▤ Pesanan Masuk</b><p class="hint">Lihat pesanan yang diterima dan tandai siap.</p></div><button class="primary" onclick="go('incoming')">Buka</button></div></div><div class="card"><div class="cardtop"><div><b>▦ Stok Menu</b><p class="hint">Tandai menu tersedia atau habis.</p></div><button class="primary" onclick="go('stock')">Kelola</button></div></div><div class="card"><b>⚙ Pengaturan pelayanan</b><p class="hint">Siapkan pesanan berdasarkan nomor antrean agar pelayanan lebih tertib.</p></div>`}
function incoming(){return `<div class="head"><h2>Pesanan Masuk</h2><span class="tag">${orders.length} pesanan</span></div>${orders.length?orders.map(o=>`<div class="card"><div class="cardtop"><b>${o.id}</b><span class="badge">${o.status}</span></div><p>${o.name} • ${o.kelas} • ${o.clock}</p><div class="hint">${Object.entries(o.items).map(([id,q])=>menu.find(m=>m.id==id).name+' × '+q).join(', ')}</div><p><b>${rp(o.total)}</b> • ${o.pay}</p><button class="primary wide" onclick="advance('${o.id}')">${o.status==='Pesanan Diterima'?'Tandai Sedang Diproses':o.status==='Sedang Diproses'?'Tandai Siap':'Pesanan Siap ✓'}</button></div>`).join(''):`<div class="empty"><div>📥</div><h3>Belum ada pesanan masuk</h3><p>Pesanan siswa akan muncul di sini setelah dikirim.</p></div>`}`}
function advance(id){let o=orders.find(o=>o.id===id);if(o)o.status=o.status==='Pesanan Diterima'?'Sedang Diproses':o.status==='Sedang Diproses'?'Siap Diambil':'Siap Diambil';render()}
function stock(){return `<div class="head"><h2>Kelola Stok Menu</h2><span class="tag">Tersedia / Habis</span></div><p class="hint">Gunakan tombol di samping menu untuk memperbarui ketersediaan.</p>${menu.map(m=>`<div class="orderrow"><div style="font-size:27px">${m.icon}</div><div style="flex:1"><b>${m.name}</b><div class="hint">${rp(m.price)}</div><span class="stock ${m.stock?'':'out'}">${m.stock?'Tersedia':'Habis'}</span></div><button class="outline" onclick="toggleStock(${m.id})">${m.stock?'Tandai Habis':'Aktifkan Stok'}</button></div>`).join('')}`}
function toggleStock(id){let m=menu.find(m=>m.id===id);m.stock=!m.stock;render()}function qrPage(){return `<div class="head"><h2>QR Code Akses</h2></div><div class="qr"><div style="font-size:36px">🍱</div><h2>KantinKita <small>SMANEKA</small></h2><div class="qrmark">▦</div><b>Scan QR untuk memesan makanan</b><p class="hint">Mudah • Cepat • Tanpa Antre<br>SMA Negeri 1 Kepanjen, Kabupaten Malang</p></div><p class="hint">Ini adalah ilustrasi QR akses. QR code belum mengarah ke hosting publik sampai aplikasi diterbitkan di layanan hosting.</p>`}
render();
</script></body></html>
